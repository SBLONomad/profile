# ─────────────────────────────────────────────
# Decap CMS Configuration
# 관리자 페이지 설정 파일입니다.
# ─────────────────────────────────────────────

backend:
  name: git-gateway
  branch: main   # 배포 브랜치 (main 또는 master)

# 미디어(이미지) 저장 경로
media_folder: "public/images/projects"
public_folder: "/images/projects"

# Netlify Identity 활성화 (Netlify 배포 필수)
publish_mode: editorial_workflow

# ─── 콘텐츠 컬렉션 ───────────────────────────
collections:
  # ── Projects 컬렉션 ──────────────────────────
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{year}}) — {{category}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "프로젝트 제목"

      - label: "Description"
        name: "description"
        widget: "text"
        hint: "프로젝트 설명 (1~2 문장)"

      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - "커머스 캠페인"
          - "상세페이지"
          - "광고 소재"
          - "브랜딩"
          - "모션"
          - "AI 이미지"
          - "UI/UX"
        default: "커머스 캠페인"

      - label: "연도"
        name: "year"
        widget: "string"
        default: "2024"
        pattern: ['^\d{4}$', "4자리 연도 (예: 2024)"]

      - label: "대표 이미지"
        name: "image"
        widget: "image"
        hint: "갤러리에 표시될 대표 이미지"
        media_library:
          config:
            max_file_size: 10000000  # 10MB

      - label: "상세 전체 이미지"
        name: "fullImage"
        widget: "image"
        required: false
        hint: "상세 페이지에서 크게 보일 전체 페이지 이미지"
        media_library:
          config:
            max_file_size: 20000000  # 20MB

      - label: "추가 상세 이미지"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.image}}"
        hint: "상세 페이지에 이어서 보여줄 이미지들을 추가하세요"
        field:
          label: "상세 이미지"
          name: "image"
          widget: "image"

      - label: "대표 노출 여부"
        name: "featured"
        widget: "boolean"
        default: true
        hint: "체크하면 Hero 롤링 배너에 표시됩니다"

      - label: "상세 설명"
        name: "body"
        widget: "markdown"
        required: false

  # ── Site Settings ──────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Profile"
        name: "profile"
        file: "content/settings/profile.md"
        fields:
          - label: "Your Name"
            name: "name"
            widget: "string"
            default: "Your Name"

          - label: "Tagline (Hero 한 줄 소개)"
            name: "tagline"
            widget: "string"
            default: "성과를 만드는 웹·콘텐츠 디자이너"

          - label: "Bio"
            name: "bio"
            widget: "text"

          - label: "Email"
            name: "email"
            widget: "string"
