# ─────────────────────────────────────────────
# Decap CMS Configuration
# 관리자 페이지 설정 파일입니다.
# ─────────────────────────────────────────────

backend:
  name: git-gateway
  branch: main   # 배포 브랜치 (main 또는 master)

# 미디어(이미지) 저장 경로
media_folder: "public/images/projects"
public_folder: "/images/projects"

# Netlify Identity 활성화 (Netlify 배포 필수)
publish_mode: editorial_workflow

# ─── 콘텐츠 컬렉션 ───────────────────────────
collections:
  # ── Projects 컬렉션 ──────────────────────────
  - name: "projects"
    label: "작업물"
    label_singular: "작업물"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{year}}) — {{category}}"
    fields:
      - label: "제목"
        name: "title"
        widget: "string"
        hint: "프로젝트 제목"

      - label: "설명"
        name: "description"
        widget: "text"
        hint: "프로젝트 설명 (1~2 문장)"

      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - "발렌라이프"
          - "이랜드월드"
          - "CTTD(G마켓)"
          - "데상트"
        default: "이랜드월드"

      - label: "연도"
        name: "year"
        widget: "string"
        required: false
        default: "2024"
        pattern: ['^\d{4}$', "4자리 연도 (예: 2024)"]

      - label: "대표 이미지"
        name: "image"
        widget: "image"
        hint: "갤러리에 표시될 대표 이미지"
        media_library:
          config:
            max_file_size: 10000000  # 10MB

      - label: "썸네일 표시 방식"
        name: "thumbnailStyle"
        widget: "select"
        required: false
        options:
          - { label: "일반 이미지", value: "image" }
          - { label: "흰색 로고 배너 (9:16)", value: "logo" }
      - label: "로고 여백 보정"
        name: "logoBounds"
        widget: "object"
        required: false
        collapsed: true
        hint: "다른 로고로 교체할 때는 이 보정값을 지우면 원본 전체가 표시됩니다."
        fields:
          - { label: "왼쪽", name: "x", widget: "number", required: false }
          - { label: "위쪽", name: "y", widget: "number", required: false }
          - { label: "폭", name: "width", widget: "number", required: false }
          - { label: "높이", name: "height", widget: "number", required: false }
          - { label: "원본 폭", name: "sourceWidth", widget: "number", required: false }
          - { label: "원본 높이", name: "sourceHeight", widget: "number", required: false }

      - label: "상세 전체 이미지"
        name: "fullImage"
        widget: "image"
        required: false
        hint: "상세 페이지에서 크게 보일 전체 페이지 이미지"
        media_library:
          config:
            max_file_size: 20000000  # 20MB

      - label: "추가 상세 이미지"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.image}}"
        hint: "상세 페이지에 이어서 보여줄 이미지들을 추가하세요"
        field:
          label: "상세 이미지"
          name: "image"
          widget: "image"

      - label: "대표 노출 여부"
        name: "featured"
        widget: "boolean"
        default: true
        hint: "체크하면 Hero 롤링 배너에 표시됩니다"

      - label: "상세 설명"
        name: "body"
        widget: "markdown"
        required: false

  # ── Site Settings ──────────────────────────
  - name: "settings"
    label: "사이트 설정"
    files:
      - label: "프로필"
        name: "profile"
        file: "content/settings/profile.md"
        fields:
          - label: "이름"
            name: "name"
            widget: "string"
            default: "김동형"

          - label: "한 줄 소개"
            name: "tagline"
            widget: "string"
            default: "성과를 만드는 웹·콘텐츠 디자이너"

          - label: "소개"
            name: "bio"
            widget: "text"

          - label: "이메일"
            name: "email"
            widget: "string"
