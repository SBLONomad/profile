<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#000;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.el{--ease:cubic-bezier(.16,1,.3,1);--ease-wipe:cubic-bezier(.3,.7,.1,1);position:relative;width:100%;background:#000}
.el img{display:block;max-width:none;border:0;-webkit-user-drag:none;user-select:none}
.el-view--pc{--u:calc(100vw / 1920)}
.el-view--mo{--u:calc(100vw / 960);display:none}
@media (max-width:768px){.el-view--pc{display:none}.el-view--mo{display:block}}

/* ---------- section / layer ---------- */
.el-sec{position:relative;width:100%;overflow:hidden;isolation:isolate}
.ly{position:absolute;margin:0;--d:0s;--dd:calc(var(--d) * .55);translate:0 var(--fy,0px)}
.ly__mask,.ly__in{position:absolute;inset:0}
.ly img{width:100%;height:100%;object-fit:cover}
.ly[data-par]{overflow:hidden}
.ly[data-par] .ly__in{inset:-6% 0;transform:translate3d(0,var(--py,0px),0)}

/* ---------- reveal (initial states only when JS is on) ---------- */
.el-js .ly{transition:opacity .8s var(--ease) var(--dd),transform 1.1s var(--ease) var(--dd),filter .9s var(--ease) var(--dd)}
.el-js .ly__mask{transition:clip-path 1.05s var(--ease-wipe) var(--dd),-webkit-clip-path 1.05s var(--ease-wipe) var(--dd)}
.el-js .ly img{transition:transform 1.6s var(--ease) var(--dd),filter 1.4s cubic-bezier(.33,0,.2,1) var(--dd)}

.el-js .ly[data-fx=fade]{opacity:0}
.el-js .ly[data-fx=rise]{opacity:0;transform:translate3d(0,calc(var(--u) * 48),0)}
.el-js .ly[data-fx=blur]{opacity:0;filter:blur(10px);transform:scale(1.04)}
.el-js .ly[data-fx=kb]{opacity:0}
.el-js .ly[data-fx=kb] img{transform:scale(1.1);filter:brightness(.55)}
.el-js .ly[data-fx=kb] img{transition:transform 3s cubic-bezier(.2,.7,.2,1) var(--dd),filter 1.4s ease-out var(--dd)}
.el-js .ly[data-fx=zoom]{opacity:0}
.el-js .ly[data-fx=zoom] img{transform:scale(1.16)}
.el-js .ly[data-fx=dark] img{filter:brightness(.08) contrast(1.15);transform:scale(1.08)}
.el-js .ly[data-fx=dark] img{transition:transform 2s var(--ease) var(--dd),filter 1.8s cubic-bezier(.3,0,.2,1) var(--dd)}
.el-js .ly[data-fx^=wipe] img,.el-js .ly[data-fx=open] img{transform:scale(1.12)}
.el-js .ly[data-fx=wipe-up] .ly__mask{-webkit-clip-path:inset(100% 0 0 0);clip-path:inset(100% 0 0 0)}
.el-js .ly[data-fx=wipe-down] .ly__mask{-webkit-clip-path:inset(0 0 100% 0);clip-path:inset(0 0 100% 0)}
.el-js .ly[data-fx=wipe-left] .ly__mask{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0)}
.el-js .ly[data-fx=wipe-right] .ly__mask{-webkit-clip-path:inset(0 0 0 100%);clip-path:inset(0 0 0 100%)}
.el-js .ly[data-fx=open] .ly__mask{-webkit-clip-path:inset(0 50% 0 50%);clip-path:inset(0 50% 0 50%)}

.el-js .ly.is-in{opacity:1;transform:none;filter:none}
.el-js .ly.is-in .ly__mask{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}
.el-js .ly.is-in img{transform:none;filter:none}

/* retract (scrolling back up): quick, no stagger */
.el-js .ly.is-out,.el-js .ly.is-out .ly__mask,.el-js .ly.is-out img{transition-duration:.45s !important;transition-delay:0s !important}

/* 05 — crossfade pair (slow drift) */
.ly[data-xf]{overflow:hidden}
.ly[data-xf="1"]{opacity:0;transition:opacity 1.8s cubic-bezier(.4,0,.2,1) !important}
.xfade.is-alt .ly[data-xf="1"]{opacity:1}
.xfade.is-live .ly[data-xf] .ly__in{animation:elDrift 9s ease-in-out infinite alternate}
@keyframes elDrift{from{transform:scale(1)}to{transform:scale(1.07)}}

/* 07 — rolling type */
.ly--roll{mix-blend-mode:overlay}
.roll{position:absolute;inset:0;overflow:hidden}
.roll__track{display:flex;height:100%;width:calc(var(--tw) * 4%);animation:elRoll var(--rs,26s) linear infinite}
.roll__track img{flex:none;width:25%;height:100%;object-fit:fill}
.el-sec:not(.is-vis) .roll__track{animation-play-state:paused}
@keyframes elRoll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-25%,0,0)}}

/* 11 — scroll-linked slow fade */
.el-js .ly[data-fx=slow]{opacity:var(--p,0);transition:none}
.el-js .ly[data-fx=slow] img{transform:scale(calc(1.1 - .1 * var(--p,0)));filter:brightness(calc(.3 + .7 * var(--p,0)));transition:none}

/* 03 — movie (inline, muted autoplay while in view) */
.movie .mv{position:absolute;inset:0;width:100%;height:100%;display:block;border:0;background:#000;object-fit:cover}
.mv__snd{position:absolute;right:calc(var(--u) * 32);bottom:calc(var(--u) * 32);width:calc(var(--u) * 56);min-width:36px;aspect-ratio:1;padding:0;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;z-index:3;display:grid;place-items:center;transition:background .25s ease,border-color .25s ease}
.el-view--mo .mv__snd{right:calc(var(--u) * 28);bottom:calc(var(--u) * 28)}
.mv__snd:hover{background:rgba(0,0,0,.6);border-color:#fff}
.mv__snd:focus-visible{outline:2px solid #fff;outline-offset:4px}
.mv__snd svg{width:46%;height:46%;display:block}
.mv__snd .on,.mv__snd[aria-pressed=true] .off{display:none}
.mv__snd[aria-pressed=true] .on{display:block}

/* 08 — day → sunset → night : day-to-night-embed-preview.html 원본 그대로 */
/* Isolated, drop-in scroll transition. Contains NO global body/html/h1 styles. */
.dn-transition {
  --dn-scroll-length: 350svh;
  --dn-object-position: center center;
  position: relative;
  box-sizing: border-box;
  display: block;
  width: 100%;
  height: var(--dn-scroll-length);
  margin: 0;
  padding: 0;
  isolation: isolate;
}
.dn-transition *, .dn-transition *::before, .dn-transition *::after { box-sizing: border-box; }
.dn-transition__stage {
  position: sticky;
  top: 0;
  width: 100%;
  height: 100vh;
  height: 100svh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  isolation: isolate;
  background: #14253a;
}
.dn-transition__image {
  position: absolute;
  display: block;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  margin: 0;
  padding: 0;
  border: 0;
  object-fit: cover;
  object-position: var(--dn-object-position);
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}
.dn-transition__image--day { z-index: 1; }
.dn-transition__image--sunset { z-index: 2; opacity: 0; }
.dn-transition__image--night { z-index: 3; opacity: 0; }
.dn-transition__a11y {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
@media (max-width: 720px) {
  .dn-transition {
    --dn-scroll-length: 300svh;
    --dn-object-position: 62% center;
  }
}
/* 이 페이지의 MO 뷰 전환점(768px)에 원본의 모바일 값(≤720px)을 맞춤 */
.el-view--mo .dn-transition{--dn-scroll-length:300svh;--dn-object-position:62% center}

/* ---------- reduced motion ---------- */
/* 기기의 '동작 줄이기' 설정을 따를 때만 적용 (effects.respectReducedMotion: true) */
@media (prefers-reduced-motion:reduce){
 .el-rm.el-js .ly,.el-rm.el-js .ly__mask,.el-rm.el-js .ly img{opacity:1 !important;transform:none !important;filter:none !important;-webkit-clip-path:none !important;clip-path:none !important;transition:none !important;translate:none !important}
 .el-rm .roll__track,.el-rm .xfade .ly__in{animation:none !important}
 .el-rm .ly[data-par] .ly__in{transform:none !important}
}
</style>

<script>
(function(){
'use strict';
var root=document.getElementById('eastlogue');
if(!root)return;
var CFG={};try{CFG=JSON.parse(document.getElementById('eastlogue-data').textContent)}catch(e){}
var FX=CFG.effects||{};
var mqReduce=window.matchMedia('(prefers-reduced-motion: reduce)');
var respectRM=FX.respectReducedMotion===true;window.__elRespectRM=respectRM;
if(respectRM)document.documentElement.classList.add('el-rm');
var reduced=function(){return respectRM&&mqReduce.matches};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var smooth=function(a,b,v){var x=clamp((v-a)/(b-a),0,1);return x*x*(3-2*x)};
var visible=function(el){return el.offsetParent!==null||getComputedStyle(el).position==='fixed'};

/* roll speed */
root.querySelectorAll('.el-view--pc .roll__track').forEach(function(t){t.style.setProperty('--rs',((FX.roll&&FX.roll.pc)||26)+'s')});
root.querySelectorAll('.el-view--mo .roll__track').forEach(function(t){t.style.setProperty('--rs',((FX.roll&&FX.roll.mo)||16)+'s')});

/* clipped layers: lazy-load can't see them, so load eagerly in the active view */
function eagerClipped(){root.querySelectorAll('.el-view').forEach(function(v){if(!visible(v))return;
  v.querySelectorAll('.ly[data-fx^=wipe] img,.ly[data-fx=open] img,.ly[data-xf] img').forEach(function(im){if(im.loading!=='eager')im.loading='eager'})})}
eagerClipped();window.addEventListener('resize',eagerClipped,{passive:true});
/* preload images well before their section scrolls in, so reveals never wait on the network */
var rv=FX.reveal||{};
if('IntersectionObserver' in window){
  var pm=rv.preload||'250%';
  var pre=new IntersectionObserver(function(ents){ents.forEach(function(e){
    if(!e.isIntersecting)return;pre.unobserve(e.target);
    e.target.querySelectorAll('img[loading=lazy]').forEach(function(im){im.loading='eager'});
  })},{rootMargin:pm+' 0px '+pm+' 0px'});
  root.querySelectorAll('.el-sec,.dn-transition').forEach(function(s){pre.observe(s)});
}
/* ---------- reveal ---------- */
var revealSel='.ly[data-fx]:not([data-fx=none]):not([data-fx=xf]):not([data-fx=slow])';
var layers=[].slice.call(root.querySelectorAll(revealSel));
function ready(el){
  var imgs=[].slice.call(el.querySelectorAll('img'));
  return Promise.all(imgs.map(function(im){
    if(im.complete&&im.naturalWidth)return im.decode?im.decode().catch(function(){}):0;
    return new Promise(function(r){im.addEventListener('load',r,{once:true});im.addEventListener('error',r,{once:true});setTimeout(r,700)});
  }));
}
function show(el){
  el._on=true;
  ready(el).then(function(){requestAnimationFrame(function(){
    if(!el._on)return;
    el.classList.remove('is-out');el.classList.add('is-in');
    var sec=el.closest('.xfade');if(sec&&el.hasAttribute('data-xf'))startXfade(sec);});});
}
/* scrolled back up past it (left through the bottom edge) → retract, so it replays on the way down */
function hide(el){
  if(!el._on)return;el._on=false;
  el.classList.add('is-out');el.classList.remove('is-in');
  var sec=el.closest('.xfade');if(sec&&el.hasAttribute('data-xf'))stopXfade(sec);

  layers.forEach(function(l){io.observe(l)});

if('IntersectionObserver' in window){
  var vo=new IntersectionObserver(function(ents){ents.forEach(function(e){
    e.target.classList.toggle('is-vis',e.isIntersecting);
    if(e.isIntersecting)live.add(e.target);else live.delete(e.target);
  });req()},{rootMargin:'15% 0px 15% 0px'});
  secs.forEach(function(s){vo.observe(s)});
}else{secs.forEach(function(s){s.classList.add('is-vis');live.add(s)})}

/* ---------- 05 crossfade ---------- */
function startXfade(sec){
  if(sec._xf||reduced())return;
  sec.classList.add('is-live');
  sec._xf=setInterval(function(){if(sec.classList.contains('is-vis')&&!document.hidden)sec.classList.toggle('is-alt')},(FX.crossfade&&FX.crossfade.interval)||3800);
}
function stopXfade(sec){
  if(!sec._xf)return;clearInterval(sec._xf);sec._xf=0;
  sec.classList.remove('is-alt','is-live');
}

/* ---------- scroll-linked: parallax / float / slow fade ---------- */
var parLim=FX.parallaxLimit||0.06;
var sfCfg=FX.slowFade||{from:1,to:.5};
var raf=0;
function req(){if(!raf)raf=requestAnimationFrame(tick)}
function tick(){
  raf=0;
  var vh=window.innerHeight,red=reduced(),again=false;
  live.forEach(function(sec){
    if(!visible(sec))return;
    var r=sec.getBoundingClientRect();
    sec.querySelectorAll('.ly[data-par]').forEach(function(l){
      if(red){l.querySelector('.ly__in').style.setProperty('--py','0px');return}
      var b=l.getBoundingClientRect(),k=parseFloat(l.dataset.par);
      var off=(b.top+b.height/2-vh/2)*-k, lim=b.height*parLim;
      l.querySelector('.ly__in').style.setProperty('--py',clamp(off,-lim,lim).toFixed(2)+'px');
    });
    sec.querySelectorAll('.ly[data-float]').forEach(function(l){
      if(red){l.style.setProperty('--fy','0px');return}
      var b=l.getBoundingClientRect(),k=parseFloat(l.dataset.float);
      var cur=parseFloat(l.style.getPropertyValue('--fy'))||0;
      var off=(b.top-cur+b.height/2-vh/2)*k;
      l.style.setProperty('--fy',off.toFixed(2)+'px');
    });
    sec.querySelectorAll('.ly[data-fx=slow]').forEach(function(l){
      var target=red?1:smooth(vh*sfCfg.from,vh*sfCfg.to,r.top);
      var cur=l._p==null?target*0:l._p;
      var next=cur+(target-cur)*0.2;
      if(Math.abs(target-next)<0.002)next=target;else again=true;
      l._p=next;l.style.setProperty('--p',next.toFixed(4));
    });
  });
  if(again)req();
}
window.addEventListener('scroll',req,{passive:true});
window.addEventListener('resize',req,{passive:true});
if(mqReduce.addEventListener)mqReduce.addEventListener('change',req);
req();

/* ---------- 03 movie ---------- */
root.querySelectorAll('.movie').forEach(function(sec){
  var vd=sec.querySelector('video.mv'),btn=sec.querySelector('.mv__snd');if(!vd)return;
  function load(){if(vd.getAttribute('src'))return;vd.poster=vd.dataset.poster||'';vd.preload='auto';vd.src=vd.dataset.src}
  if(reduced()){load();vd.controls=true;vd.loop=false;if(btn)btn.hidden=true;return}
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(e){if(e[0].isIntersecting)load()},{rootMargin:'150% 0px 150% 0px'}).observe(sec);
    new IntersectionObserver(function(e){
      if(e[0].isIntersecting){load();var p=vd.play();if(p&&p.catch)p.catch(function(){})}else vd.pause();
    },{threshold:0.2}).observe(sec);
  }else{load();vd.controls=true}
  if(btn)btn.addEventListener('click',function(){
    vd.muted=!vd.muted;
    btn.setAttribute('aria-pressed',String(!vd.muted));
    btn.setAttribute('aria-label',vd.muted?'영상 소리 켜기':'영상 소리 끄기');
    if(!vd.muted&&vd.paused){var p=vd.play();if(p&&p.catch)p.catch(function(){})}
  });
});
})();
</script>
<script>
/* Day → sunset → night. Uses native position:sticky; no libraries required.
   Add the section from fragment.html, link day-night.css, and defer this JS.
   Supports multiple instances and scrolling both directions. */
(() => {
  'use strict';

  const scenes = Array.from(document.querySelectorAll('.dn-transition')).map((section) => ({
    section,
    stage: section.querySelector('.dn-transition__stage'),
    sunset: section.querySelector('.dn-transition__image--sunset'),
    night: section.querySelector('.dn-transition__image--night'),
    announcer: section.querySelector('.dn-transition__a11y'),
    phase: ''
  })).filter((scene) => scene.stage && scene.sunset && scene.night);
  if (!scenes.length) return;

  const reducedMotion = window.__elRespectRM === false ? { matches: false } : window.matchMedia('(prefers-reduced-motion: reduce)');
  const clamp = (value) => Math.max(0, Math.min(1, value));
  function smoothstep(start, end, value) {
    const x = clamp((value - start) / (end - start));
    return x * x * (3 - 2 * x);
  }
  let raf = 0;

  function update() {
    raf = 0;
    for (const scene of scenes) {
      const length = Math.max(1, scene.section.offsetHeight - scene.stage.offsetHeight);
      const progress = clamp(-scene.section.getBoundingClientRect().top / length);
      const sunsetOpacity = reducedMotion.matches
        ? Number(progress >= 0.43)
        : smoothstep(0.06, 0.43, progress);
      const nightOpacity = reducedMotion.matches
        ? Number(progress >= 0.79)
        : smoothstep(0.59, 0.97, progress);
      scene.sunset.style.opacity = String(sunsetOpacity);
      scene.night.style.opacity = String(nightOpacity);

      const phase = progress < 0.32 ? '낮' : progress < 0.73 ? '붉은 노을' : '밤';
      if (phase !== scene.phase) {
        scene.phase = phase;
        if (scene.announcer) scene.announcer.textContent = `현재 시간대: ${phase}`;
      }
    }
  }
  function requestUpdate() {
    if (!raf) raf = window.requestAnimationFrame(update);
  }
  window.addEventListener('scroll', requestUpdate, { passive: true });
  window.addEventListener('resize', requestUpdate, { passive: true });
  if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', requestUpdate);
  requestUpdate();
})();
</script>
