/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}

#wrap{position:relative;margin:0 auto;overflow:hidden}

.sec > .lay{position:absolute;display:block;height:auto}

/* ===================================================================
   SCROLL EFFECT
   배경은 페이드, 사진은 놓인 위치에 따라 좌·우·아래·위에서 들어옵니다.
   이동 거리는 32~40px 로 짧게, 지속시간·이징은 한 세트로 통일해
   여러 방향이어도 화면이 들뜨지 않습니다.
   화면에 들어오면 .is-in 부여 / 벗어나면 제거 → 효과가 매번 반복됩니다.
   =================================================================== */
[data-fx]{
  opacity:0;
  transition:opacity 1.1s cubic-bezier(.22,.61,.36,1),
             transform 1.1s cubic-bezier(.22,.61,.36,1);
  transition-delay:var(--d,0s);
}
[data-fx="rise"] {transform:translateY(32px)}   /* 아래에서 */
[data-fx="drop"] {transform:translateY(-32px)}  /* 위에서 */
[data-fx="left"] {transform:translateX(-40px)}  /* 왼쪽에서 */
[data-fx="right"]{transform:translateX(40px)}   /* 오른쪽에서 */
[data-fx="soft"] {transform:translateY(12px)}   /* 카피·로고 */
[data-fx="fade"] {}                             /* 배경 : 움직임 없음 */
[data-fx].is-in{opacity:1;transform:none}

/* ---------- 04 : 롤링 밴드 (오른쪽 → 왼쪽 무한) ----------
   이미지는 세로에 맞춰 원래 비율대로 흐르므로, 소스가 960px 폭이든
   1920px 폭이든 잘리지 않고 그대로 지나갑니다. */
.roll{position:absolute;inset:0;overflow:hidden}
.roll__track{display:flex;width:max-content;height:100%;
  animation:dscRoll 34s linear infinite}
.roll__track img{display:block;flex:none;height:100%;width:auto;max-width:none}
@keyframes dscRoll{
  from{transform:translate3d(0,0,0)}
  to  {transform:translate3d(-50%,0,0)}
}
.sec04:not(.is-view) .roll__track{animation-play-state:paused}

/* ---------- 07 : 영상 (PC 1920x1080 / MO 960x540 · 둘 다 16:9) ---------- */
.movie{position:absolute;inset:0;background:#000;overflow:hidden}
.movie video{width:100%;height:100%;display:block;object-fit:cover;background:#000}

/* ---------- 모션 최소화 설정 ---------- */
@media (prefers-reduced-motion:reduce){
  [data-fx]{opacity:1!important;transform:none!important;transition:none!important}
  .roll__track{animation:none}
}

<script>
(function(){
  var wrap=document.getElementById('wrap'), cur='';
  function pick(){
    return (/Android|iPhone|iPod|IEMobile|BlackBerry|Opera Mini|Windows Phone/i
            .test(navigator.userAgent) || window.innerWidth<=768) ? 'mo' : 'pc';
  }
  function apply(){
    var m=pick(); if(m===cur)return; cur=m;
    wrap.className=m;
    wrap.innerHTML=document.getElementById('tpl-'+m).innerHTML;
    if(window.DESCENTE_INIT)window.DESCENTE_INIT();
  }
  apply();
  var t; window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(apply,200)});
})();
</script>
<script>
/* ===================================================================
   스크롤 리빌 : 들어오면 .is-in / 나가면 제거 → 효과 반복
   섹션 in-view : 롤링 밴드 재생·정지, 영상 재생·정지
   =================================================================== */
(function () {
  'use strict';
  var ROOT = document.getElementById('wrap');
  if (!ROOT) return;
  var reduce = window.matchMedia &&
               window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var targets, secs, io, io2;

  function setSection(sec, inView) {
    sec.classList.toggle('is-view', inView);
    var v = sec.querySelector('video');
    if (!v) return;
    if (inView) { var p = v.play(); if (p && p.catch) p.catch(function(){}); }
    else if (!v.paused) { v.pause(); }
  }
  /* 수동 1회 검사 - 일부 인앱 브라우저에서 IO 첫 콜백이 늦게 오는 경우 대비 */
  function sync() {
    var vh = window.innerHeight, edge = vh * 0.06, i, r;
    for (i = 0; i < targets.length; i++) {
      r = targets[i].getBoundingClientRect();
      targets[i].classList.toggle('is-in', r.top < vh - edge && r.bottom > 0);
    }
    for (i = 0; i < secs.length; i++) {
      r = secs[i].getBoundingClientRect();
      setSection(secs[i], r.top < vh && r.bottom > 0);
    }
  }
  function init() {
    if (io)  io.disconnect();
    if (io2) io2.disconnect();
    var root = document.getElementById('wrap');
    if (!root) return;
    targets = root.querySelectorAll('[data-fx]');
    secs    = root.querySelectorAll('.sec');
    if (!('IntersectionObserver' in window) || reduce) {
      for (var i = 0; i < targets.length; i++) targets[i].classList.add('is-in');
      for (var s = 0; s < secs.length; s++) setSection(secs[s], true);
      return;
    }
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { e.target.classList.toggle('is-in', e.isIntersecting); });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0 });
    for (var j = 0; j < targets.length; j++) io.observe(targets[j]);
    io2 = new IntersectionObserver(function (es) {
      es.forEach(function (e) { setSection(e.target, e.isIntersecting); });
    }, { threshold: 0.15 });
    for (var k = 0; k < secs.length; k++) io2.observe(secs[k]);
    sync();
  }
  window.DESCENTE_INIT = init;
  init();
  window.addEventListener('load', function(){ if(targets) sync(); });
  window.addEventListener('pageshow', function(){ if(targets) sync(); });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && targets) sync(); });
})();
</script>
